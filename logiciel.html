ct-fit:contain;background:linear-gradient(145deg,#fff,#e9edff);border-radius:20px;padding:15px;box-shadow:0 10px 26px #0005}.detail-logo .letter{font-size:55px;color:var(--mint);font-weight:800}.detail-hero h1{font-size:clamp(30px,4vw,48px);margin:0 0 8px;letter-spacing:-1.5px}.detail-hero p{color:#c6d2f6;line-height:1.6;margin:0 0 15px}.detail-actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{padding:12px 15px;border:1px solid #2b58d4;border-radius:25px;color:#dce5ff;font-size:13px}.detail-section{padding:23px 0;border-bottom:1px solid #182d8b}.detail-section h2{font-size:23px;margin:0 0 13px}.detail-section p,.detail-section li{color:#c6d2f6;line-height:1.8}.detail-section ul{padding-left:20px}.tutorial-box{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.demo{border:1px solid #1d50cf;border-radius:17px;padding:15px;background:#070b50;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:13px}.demo-window{border:1px solid #4562d8;border-radius:8px;padding:12px;background:#0b125f}.demo-bar{height:8px;width:55%;border-radius:5px;background:#3447a8;margin-bottom:12px}.demo-button{display:inline-block;background:var(--mint);color:#05265e;padding:8px 13px;border-radius:6px;font-size:12px;font-weight:800;animation:pulse 2s infinite}.demo-progress{height:7px;background:#202c82;border-radius:9px;overflow:hidden}.demo-progress span{display:block;width:0;height:100%;background:var(--mint);animation:progress 5s infinite}.steps{counter-reset:step;list-style:none;padding:0!important}.steps li{counter-increment:step;margin:12px 0;display:flex;gap:12px}.steps li:before{content:counter(step);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#05265e;font-weight:800}.notice{padding:14px 16px;border-left:3px solid var(--mint);background:#08105d;color:#c6d2f6;border-radius:0 12px 12px 0;font-size:13px;line-height:1.6}@keyframes progress{0%,15%{width:0}80%,100%{width:100%}}@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}@media(max-width:1050px){.sidebar{width:210px;padding:22px 16px}.main{margin-left:210px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.sidebar{position:relative;width:auto;inset:auto;padding:13px}.brand{margin-bottom:14px}.nav{display:flex;overflow-x:auto;gap:4px}.nav a{min-width:max-content;padding:10px;font-size:13px}.nav svg{width:19px;height:19px}.side-tip{display:none}.main{margin-left:0;padding:22px 15px 35px}.topline{align-items:flex-start;flex-direction:column;margin-bottom:27px}.search{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.software-card{padding:12px;border-radius:15px}.software-logo{height:90px}.software-card h2{font-size:16px}.software-card p{font-size:12px}.card-link{padding:10px 8px;font-size:11px}.detail-hero{align-items:flex-start;flex-direction:column;padding:18px}.detail-logo{width:90px;height:90px}.detail-logo img{width:64px;height:64px}.tutorial-box{grid-template-columns:1fr}}@media(max-width:380px){.grid{grid-template-columns:1fr}}

const s=window.UNLOCKHUB_SOFTWARE.find(x=>x.id===new URLSearchParams(location.search).get('id'));const root=document.getElementById('detail');if(!s){root.innerHTML='<a class="back" href="outils.html">← Retour au catalogue</a><h1 class="page-title">Logiciel introuvable</h1><p class="intro">Cette fiche n’existe pas ou le lien est incorrect.</p><a class="download" style="max-width:220px" href="outils.html">Parcourir les logiciels</a>'}else{document.title=s.name+' — UnlockHub';root.innerHTML=`<a class="back" href="outils.html">← Retour au catalogue</a><div class="eyebrow">${s.cat.toUpperCase()}</div><section class="detail-hero"><div class="detail-logo">${s.logo?`<img src="${s.logo}" alt="Logo de ${s.name}">`:`<span class="letter">${s.letter}</span>`}</div><div><h1>${s.name}</h1><p>${s.desc}</p><div class="meta">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tag">${s.version}</span></div><div class="detail-actions"><a class="download" href="${s.download}" target="_blank" rel="noopener noreferrer">↓ Télécharger sur le site officiel</a>${s.guide?`<a class="secondary" href="${s.guide}">Lire le guide</a>`:''}<a class="secondary" href="outils.html">Autres logiciels</a></div></div></section><section class="detail-section"><h2>À propos de ${s.name}</h2><p>${s.about}</p></section><section class="detail-section"><h2>À quoi sert-il ?</h2><p>${s.use}</p><div class="notice">Conseil UnlockHub : télécharge toujours le logiciel depuis le site officiel indiqué sur cette page. Évite les installateurs provenant de sites inconnus.</div></section><section class="detail-section"><h2>Tutoriel d’installation</h2><p>Voici les étapes principales pour installer ${s.name}. L’animation ci-dessous illustre un assistant d’installation générique ; les boutons exacts peuvent varier selon la version du logiciel.</p><div class="tutorial-box"><div class="demo" role="img" aria-label="Animation illustrative des étapes de téléchargement et d’installation"><div class="demo-window"><div class="demo-bar"></div><strong>Installation de ${s.name}</strong><p style="font-size:12px;color:#c6d2f6">Préparation de l’installation…</p><div class="demo-progress"><span></span></div><div style="text-align:right;margin-top:12px"><span class="demo-button">Suivant →</span></div></div><small style="color:#8fa8e9">Animation illustrative · pas une capture réelle du logiciel</small></div><ol class="steps">${s.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div><p class="notice">Le tutoriel GIF spécifique à l’interface réelle de ce logiciel pourra être ajouté dans cette zone. L’animation actuelle est une démonstration visuelle et ne remplace pas une capture réelle de l’installation.</p></section><section class="detail-section"><h2>Téléchargement sécurisé</h2><p>Utilise le lien officiel ci-dessous et vérifie que la version proposée est compatible avec ton ordinateur.</p><a class="download" style="max-width:330px" href="${s.download}" target="_blank" rel="noopener noreferrer">Accéder au téléchargement officiel ↗</a></section>`}document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())location.href='outils.html?q='+encodeURIComponent(e.target.value.trim())});</script></body></html>
